<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS · Smart Retail POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F2;
    --paper:#FFFFFF;
    --ink:#16231F;
    --ink-soft:#5B655F;
    --teal:#1F5D4E;
    --teal-dark:#123A30;
    --teal-tint:#E7F0EB;
    --amber:#E2A63B;
    --amber-tint:#FBF0DA;
    --amber-dark:#8A5A16;
    --border:#DCDFD5;
    --danger:#B54F45;
    --danger-tint:#FBEDEB;
    --success:#2F7A4D;
    --success-tint:#E4F0E7;
    --radius:12px;
    --font-display:'Fraunces', serif;
    --font-sans:'Work Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-sans);
    background:var(--bg);
    color:var(--ink);
    display:flex;
    min-height:100vh;
  }
  button,input,select{font-family:var(--font-sans);}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:208px; flex-shrink:0; background:var(--teal); color:#EAF2ED;
    display:flex; flex-direction:column; padding:22px 12px; position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; flex-direction:column; padding:4px 8px 20px; }
  .brand .eyebrow{ font-family:var(--font-mono); font-size:11px; color:#AFD1C0; }
  .brand h1{ font-family:var(--font-display); font-weight:600; font-size:18px; margin:2px 0 0; }
  nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
    color:#CFE3D8; font-size:13px; cursor:pointer; border:none; background:none; text-align:left; width:100%;
  }
  .nav-item svg{ flex-shrink:0; opacity:0.9; }
  .nav-item:hover{ background:rgba(255,255,255,0.08); color:#fff; }
  .nav-item.active{ background:var(--amber); color:#3A2606; font-weight:500; }
  .nav-item.active svg{ opacity:1; }
  .sidebar-footer{
    font-family:var(--font-mono); font-size:10.5px; color:#8FB6A2;
    padding:12px 10px 4px; border-top:1px solid rgba(255,255,255,0.12); margin-top:10px;
  }

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:16px 28px;
    border-bottom:1px solid var(--border); background:var(--paper);
  }
  .topbar h2{ font-family:var(--font-display); font-weight:600; font-size:20px; margin:0; }
  .topbar .date{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .top-right{ display:flex; align-items:center; gap:14px; }
  .role-pill{ font-size:12px; font-family:var(--font-mono); background:var(--teal-tint); color:var(--teal-dark); padding:5px 10px; border-radius:20px; }
  .avatar{ width:32px; height:32px; border-radius:50%; background:var(--amber); color:#3A2606; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:12.5px; }

  .pos-body{ flex:1; display:grid; grid-template-columns: 1.5fr 400px; gap:0; min-height:0; }

  /* ---------- Left: catalog ---------- */
  .catalog{ padding:20px 24px; overflow-y:auto; }
  .scan-row{ display:flex; gap:10px; margin-bottom:12px; }
  .scan-field, .search-field{ position:relative; flex:1; }
  .scan-field input, .search-field input{
    width:100%; padding:10px 12px 10px 36px; border:1px solid var(--border); border-radius:9px;
    font-size:13.5px; background:var(--paper); outline:none;
  }
  .scan-field input:focus, .search-field input:focus{ border-color:var(--teal); box-shadow:0 0 0 3px rgba(31,93,78,0.1); }
  .field-icon{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-soft); }
  .scan-msg{ font-size:12px; margin:6px 2px 0; min-height:16px; }
  .scan-msg.err{ color:var(--danger); }
  .scan-msg.ok{ color:var(--success); }

  .cat-chips{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 18px; }
  .cat-chip{
    padding:6px 13px; border-radius:20px; border:1px solid var(--border); background:var(--paper);
    font-size:12.5px; color:var(--ink-soft); cursor:pointer;
  }
  .cat-chip:hover{ border-color:var(--teal); }
  .cat-chip.active{ background:var(--teal); border-color:var(--teal); color:#fff; }

  .product-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px; }
  .product-card{
    background:var(--paper); border:1px solid var(--border); border-radius:10px; padding:12px;
    cursor:pointer; position:relative; transition:border-color .12s ease;
  }
  .product-card:hover{ border-color:var(--teal); }
  .product-card.disabled{ opacity:0.5; cursor:not-allowed; }
  .product-card.disabled:hover{ border-color:var(--border); }
  .p-badge{
    position:absolute; top:8px; right:8px; font-size:10px; font-family:var(--font-mono);
    padding:2px 6px; border-radius:5px;
  }
  .p-badge.low{ background:var(--amber-tint); color:var(--amber-dark); }
  .p-badge.out{ background:var(--danger-tint); color:var(--danger); }
  .p-cat{ font-size:10.5px; color:var(--ink-soft); text-transform:none; margin:0 0 6px; }
  .p-name{ font-size:13.5px; font-weight:500; margin:0 0 4px; line-height:1.3; }
  .p-price{ font-family:var(--font-mono); font-size:13px; color:var(--teal-dark); }
  .p-stock{ font-size:10.5px; color:var(--ink-soft); margin-top:4px; }

  /* ---------- Right: cart ---------- */
  .cart-panel{ background:var(--paper); border-left:1px solid var(--border); display:flex; flex-direction:column; min-height:0; }
  .cart-scroll{ flex:1; overflow-y:auto; padding:18px 20px 6px; }

  .customer-box{ border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:16px; }
  .customer-box select{
    width:100%; border:none; font-size:13.5px; font-weight:500; padding:2px 0; outline:none; background:none;
  }
  .customer-meta{ display:flex; gap:14px; margin-top:8px; font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono); flex-wrap:wrap; }
  .tier-pill{ font-family:var(--font-sans); font-size:11px; padding:2px 8px; border-radius:20px; font-weight:500; }
  .tier-pill.Regular{ background:var(--bg); color:var(--ink-soft); }
  .tier-pill.Silver{ background:#EFEFEF; color:#555; }
  .tier-pill.Gold{ background:var(--amber-tint); color:var(--amber-dark); }

  .cart-title{ font-family:var(--font-display); font-weight:600; font-size:15px; margin:0 0 10px; }
  .cart-empty{ font-size:13px; color:var(--ink-soft); text-align:center; padding:30px 10px; }

  .cart-line{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .cl-info{ flex:1; min-width:0; }
  .cl-name{ font-size:13px; font-weight:500; margin:0; }
  .cl-price{ font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono); margin-top:2px; }
  .cl-qty{ display:flex; align-items:center; gap:6px; }
  .qty-btn{
    width:22px; height:22px; border-radius:6px; border:1px solid var(--border); background:var(--paper);
    cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:14px; padding:0;
  }
  .qty-btn:hover{ border-color:var(--teal); color:var(--teal); }
  .qty-val{ font-family:var(--font-mono); font-size:13px; width:18px; text-align:center; }
  .cl-total{ font-family:var(--font-mono); font-size:13px; width:60px; text-align:right; }
  .cl-remove{ background:none; border:none; color:var(--ink-soft); cursor:pointer; padding:2px; }
  .cl-remove:hover{ color:var(--danger); }

  .totals{ padding:14px 20px; border-top:1px solid var(--border); font-size:13px; }
  .t-row{ display:flex; justify-content:space-between; margin-bottom:6px; color:var(--ink-soft); }
  .t-row.grand{ color:var(--ink); font-weight:600; font-size:16px; font-family:var(--font-display); margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); }
  .t-row span:last-child{ font-family:var(--font-mono); }

  .pay-section{ padding:0 20px 18px; }
  .pay-tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .pay-tab{
    flex:1; padding:8px 0; text-align:center; font-size:12px; border:1px solid var(--border); border-radius:8px;
    background:var(--paper); cursor:pointer; color:var(--ink-soft);
  }
  .pay-tab:hover:not(.disabled){ border-color:var(--teal); }
  .pay-tab.active{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .pay-tab.disabled{ opacity:0.45; cursor:not-allowed; }

  .pay-field{ margin-bottom:10px; }
  .pay-field label{ font-size:12px; color:var(--ink-soft); display:block; margin-bottom:5px; }
  .pay-field input{ width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:13.5px; font-family:var(--font-mono); outline:none; }
  .pay-field input:focus{ border-color:var(--teal); }
  .pay-note{ font-size:12px; margin-top:6px; }
  .pay-note.err{ color:var(--danger); }
  .pay-note.ok{ color:var(--success); }

  .btn-complete{
    width:100%; padding:12px 0; background:var(--amber); color:#3A2606; border:none; border-radius:9px;
    font-size:14.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-complete:hover{ background:var(--amber-dark); color:#fff; }
  .btn-complete:disabled{ opacity:0.5; cursor:not-allowed; }
  .spinner{ width:14px; height:14px; border:2px solid rgba(58,38,6,0.35); border-top-color:#3A2606; border-radius:50%; animation:spin .7s linear infinite; display:none; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- Receipt success overlay ---------- */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(20,35,30,0.45);
    align-items:center; justify-content:center; z-index:50; padding:24px;
  }
  .overlay.show{ display:flex; }
  .receipt-card{
    background:#fff; width:300px; padding:22px 22px 26px; max-height:88vh; overflow-y:auto;
    clip-path: polygon(0 0,100% 0,100% 96%,95% 100%,90% 96%,85% 100%,80% 96%,75% 100%,70% 96%,65% 100%,60% 96%,55% 100%,50% 96%,45% 100%,40% 96%,35% 100%,30% 96%,25% 100%,20% 96%,15% 100%,10% 96%,5% 100%,0 96%);
  }
  .receipt-card h3{ font-family:var(--font-mono); font-size:14px; text-align:center; margin:0 0 2px; }
  .receipt-card .rc-sub{ font-family:var(--font-mono); font-size:11px; text-align:center; color:var(--ink-soft); margin:0 0 4px; }
  .rc-rule{ border:none; border-top:1px dashed #C7CBC0; margin:10px 0; }
  .rc-item{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:12px; margin-bottom:4px; }
  .rc-summary-row{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:12px; margin-bottom:3px; }
  .rc-total-row{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:13.5px; font-weight:500; margin-top:6px; }
  .rc-loyalty{ text-align:center; font-size:11.5px; color:var(--teal-dark); background:var(--teal-tint); border-radius:6px; padding:6px; margin-top:12px; }
  .rc-barcode{ height:32px; margin-top:16px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px); }
  .rc-barcode-label{ font-family:var(--font-mono); font-size:10px; text-align:center; color:var(--ink-soft); margin-top:6px; }
  .rc-actions{ display:flex; gap:8px; margin-top:18px; }
  .rc-actions button{
    flex:1; padding:9px 0; border-radius:8px; font-size:12.5px; cursor:pointer; font-family:var(--font-sans);
  }
  .btn-new{ background:var(--teal); color:#fff; border:none; }
  .btn-print{ background:var(--paper); color:var(--ink); border:1px solid var(--border); }

  @media (max-width: 1000px){
    .pos-body{ grid-template-columns:1fr; }
    .cart-panel{ border-left:none; border-top:1px solid var(--border); }
  }
</style>
</head>

  <div class="main">
    <header class="topbar">
      <div>
        <h2>POS</h2>
        <p class="date" id="todayDate"></p>
      </div>
      <div class="top-right">
        <a href="login.html" style="font-size:12px;color:var(--ink-soft);text-decoration:none;">Log out</a>
        <span class="role-pill">Cashier</span>
        <div class="avatar">KA</div>
      </div>
    </header>

    <div class="pos-body">

      <!-- Catalog -->
      <section class="catalog">
        <div class="scan-row">
          <div class="scan-field">
            <span class="field-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="2" height="14"/><rect x="7" y="5" width="1" height="14"/><rect x="10" y="5" width="2" height="14"/><rect x="14" y="5" width="1" height="14"/><rect x="17" y="5" width="2" height="14"/><rect x="21" y="5" width="1" height="14"/></svg>
            </span>
            <input type="text" id="barcodeInput" placeholder="Scan or type a barcode, then press Enter">
          </div>
          <div class="search-field">
            <span class="field-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </span>
            <input type="text" id="searchInput" placeholder="Search products">
          </div>
        </div>
        <p class="scan-msg" id="scanMsg"></p>

        <div class="cat-chips" id="catChips"></div>
        <div class="product-grid" id="productGrid"></div>
      </section>

      <!-- Cart -->
      <aside class="cart-panel">

          <div class="customer-box">
            <select id="customerSelect"></select>
            <div class="customer-meta" id="customerMeta"></div>

          <p class="cart-title">Cart</p>
          <div id="cartLines"><p class="cart-empty">Scan or select a product to start the sale.</p></div>
        </div>

        <div class="totals" id="totalsBox"></div>

        <div class="pay-section">
          <div class="pay-tabs" id="payTabs">
            <button class="pay-tab active" data-method="Cash">Cash</button>
            <button class="pay-tab" data-method="Card">Card</button>
            <button class="pay-tab" data-method="Digital">Digital</button>
            <button class="pay-tab" data-method="Due">Due</button>
          </div>
          <div id="payFields"></div>
          <button class="btn-complete" id="completeBtn" disabled>
            <span class="spinner" id="completeSpinner"></span>
            <span id="completeLabel">Complete sale</span>
          </button>
        </div>
      </aside>

    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="receipt-card" id="receiptCard"></div>
  </div>

<script>

  var customers = [
    { id:"guest", name:"Guest", tier:null, creditLimit:0, due:0, points:0 },
    { id:"c1", name:"Rahim Ahmed", tier:"Gold", creditLimit:5000, due:2000, points:1240 },
    { id:"c2", name:"Karim Uddin", tier:"Silver", creditLimit:2000, due:1800, points:640 },
    { id:"c3", name:"Nasrin Akter", tier:"Regular", creditLimit:500, due:0, points:80 }
  ];

  var state = {
    activeCategory:"All",
    cart:[],
    customerId:"guest",
    payMethod:"Cash"
  };

  /* ---------- Category chips ---------- */
  var catChips = document.getElementById("catChips");
  categories.forEach(function(cat){
    var chip = document.createElement("button");
    chip.className = "cat-chip" + (cat === "All" ? " active" : "");
    chip.textContent = cat;
    chip.addEventListener("click", function(){
      state.activeCategory = cat;
      document.querySelectorAll(".cat-chip").forEach(function(c){ c.classList.remove("active"); });
      chip.classList.add("active");
      renderProducts();
    });
    catChips.appendChild(chip);
  });

  /* ---------- Product grid ---------- */
  var productGrid = document.getElementById("productGrid");
  function renderProducts(){
    var q = document.getElementById("searchInput").value.trim().toLowerCase();
    productGrid.innerHTML = "";
    products
      .filter(function(p){ return state.activeCategory === "All" || p.category === state.activeCategory; })
      .filter(function(p){ return !q || p.name.toLowerCase().indexOf(q) !== -1; })
      .forEach(function(p){
        var card = document.createElement("div");
        card.className = "product-card" + (p.stock === 0 ? " disabled" : "");
        var badge = "";
        if(p.stock === 0) badge = '<span class="p-badge out">Out of stock</span>';
        else if(p.stock <= 10) badge = '<span class="p-badge low">Low stock</span>';
        card.innerHTML =
          badge +
          '<p class="p-cat">' + p.category + '</p>' +
          '<p class="p-name">' + p.name + '</p>' +
          '<p class="p-price">Tk ' + p.price.toLocaleString() + '</p>' +
          '<p class="p-stock">' + p.stock + ' in stock</p>';
        card.addEventListener("click", function(){
          if(p.stock === 0) return;
          addToCart(p.id);
        });
        productGrid.appendChild(card);
      });
  }
  document.getElementById("searchInput").addEventListener("input", renderProducts);

  /* ---------- Barcode scan ---------- */
  var scanMsg = document.getElementById("scanMsg");
  document.getElementById("barcodeInput").addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    var code = e.target.value.trim();
    e.target.value = "";
    if(!code) return;
    var product = products.find(function(p){ return p.barcode === code; });
    if(!product){
      scanMsg.textContent = "Barcode not found.";
      scanMsg.className = "scan-msg err";
      return;
    }
    if(product.stock === 0){
      scanMsg.textContent = product.name + " is out of stock.";
      scanMsg.className = "scan-msg err";
      return;
    }
    addToCart(product.id);
    scanMsg.textContent = product.name + " added.";
    scanMsg.className = "scan-msg ok";
  });

  /* ---------- Customer select ---------- */
  var customerSelect = document.getElementById("customerSelect");
  customers.forEach(function(c){
    var opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.name;
    customerSelect.appendChild(opt);
  });
  customerSelect.addEventListener("change", function(){
    state.customerId = customerSelect.value;
    renderCustomerMeta();
    renderCart();
  });

  function getCustomer(){ return customers.find(function(c){ return c.id === state.customerId; }); }

  function renderCustomerMeta(){
    var c = getCustomer();
    var meta = document.getElementById("customerMeta");
    if(c.id === "guest"){
      meta.innerHTML = "<span>Pays in full · no due allowed</span>";
      return;
    }
    var avail = c.creditLimit - c.due;
    meta.innerHTML =
      '<span class="tier-pill ' + c.tier + '">' + c.tier + '</span>' +
      '<span>' + c.points + ' pts</span>' +
      '<span>Due Tk ' + c.due.toLocaleString() + '</span>' +
      '<span>Avail Tk ' + avail.toLocaleString() + '</span>';
  }
  renderCustomerMeta();

  /* ---------- Cart ---------- */
  function addToCart(productId){
    var product = products.find(function(p){ return p.id === productId; });
    var line = state.cart.find(function(l){ return l.id === productId; });
    var currentQty = line ? line.qty : 0;
    if(currentQty + 1 > product.stock) return;
    if(line){ line.qty++; }
    else { state.cart.push({ id: productId, qty: 1 }); }
    renderCart();
  }
  function changeQty(productId, delta){
    var product = products.find(function(p){ return p.id === productId; });
    var line = state.cart.find(function(l){ return l.id === productId; });
    if(!line) return;
    var newQty = line.qty + delta;
    if(newQty <= 0){
      state.cart = state.cart.filter(function(l){ return l.id !== productId; });
    } else if(newQty <= product.stock){
      line.qty = newQty;
    }
    renderCart();
  }
  function removeLine(productId){
    state.cart = state.cart.filter(function(l){ return l.id !== productId; });
    renderCart();
  }

  function calcTotals(){
    var subtotal = state.cart.reduce(function(sum, l){
      var p = products.find(function(pp){ return pp.id === l.id; });
      return sum + p.price * l.qty;
    }, 0);
    var c = getCustomer();
    var tierRate = c.tier ? TIER_DISCOUNT[c.tier] : 0;
    var loyaltyDiscount = Math.round(subtotal * tierRate);
    var taxable = subtotal - loyaltyDiscount;
    var vat = Math.round(taxable * VAT_RATE);
    var total = taxable + vat;
    return { subtotal:subtotal, loyaltyDiscount:loyaltyDiscount, vat:vat, total:total, tierRate:tierRate };
  }

  function renderCart(){
    var cartLines = document.getElementById("cartLines");
    if(state.cart.length === 0){
      cartLines.innerHTML = '<p class="cart-empty">Scan or select a product to start the sale.</p>';
    } else {
      cartLines.innerHTML = "";
      state.cart.forEach(function(l){
        var p = products.find(function(pp){ return pp.id === l.id; });
        var row = document.createElement("div");
        row.className = "cart-line";
        row.innerHTML =
          '<div class="cl-info"><p class="cl-name">' + p.name + '</p><p class="cl-price">Tk ' + p.price.toLocaleString() + ' each</p></div>' +
          '<div class="cl-qty">' +
            '<button class="qty-btn" data-act="minus" data-id="' + p.id + '">–</button>' +
            '<span class="qty-val">' + l.qty + '</span>' +
            '<button class="qty-btn" data-act="plus" data-id="' + p.id + '">+</button>' +
          '</div>' +
          '<span class="cl-total">Tk ' + (p.price * l.qty).toLocaleString() + '</span>' +
          '<button class="cl-remove" data-act="remove" data-id="' + p.id + '" aria-label="Remove">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
          '</button>';
        cartLines.appendChild(row);
      });
      cartLines.querySelectorAll("[data-act='plus']").forEach(function(b){ b.addEventListener("click", function(){ changeQty(parseInt(b.getAttribute("data-id")), 1); }); });
      cartLines.querySelectorAll("[data-act='minus']").forEach(function(b){ b.addEventListener("click", function(){ changeQty(parseInt(b.getAttribute("data-id")), -1); }); });
      cartLines.querySelectorAll("[data-act='remove']").forEach(function(b){ b.addEventListener("click", function(){ removeLine(parseInt(b.getAttribute("data-id"))); }); });
    }
    renderTotals();
    renderPayFields();
    updateCompleteState();
  }

  function renderTotals(){
    var t = calcTotals();
    var box = document.getElementById("totalsBox");
    var rows = '<div class="t-row"><span>Subtotal</span><span>Tk ' + t.subtotal.toLocaleString() + '</span></div>';
    if(t.loyaltyDiscount > 0){
      rows += '<div class="t-row"><span>Loyalty discount</span><span>-Tk ' + t.loyaltyDiscount.toLocaleString() + '</span></div>';
    }
    rows += '<div class="t-row"><span>VAT (5%)</span><span>Tk ' + t.vat.toLocaleString() + '</span></div>';
    rows += '<div class="t-row grand"><span>Total</span><span>Tk ' + t.total.toLocaleString() + '</span></div>';
    box.innerHTML = rows;
  }

  /* ---------- Payment ---------- */
  document.querySelectorAll(".pay-tab").forEach(function(tab){
    tab.addEventListener("click", function(){
      if(tab.classList.contains("disabled")) return;
      state.payMethod = tab.getAttribute("data-method");
      document.querySelectorAll(".pay-tab").forEach(function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      renderPayFields();
      updateCompleteState();
    });
  });

  function renderPayFields(){
    var c = getCustomer();
    var dueTab = document.querySelector(".pay-tab[data-method='Due']");
    if(c.id === "guest"){
      dueTab.classList.add("disabled");
      if(state.payMethod === "Due"){ state.payMethod = "Cash"; document.querySelector(".pay-tab[data-method='Cash']").classList.add("active"); dueTab.classList.remove("active"); }
    } else {
      dueTab.classList.remove("disabled");
    }

    var t = calcTotals();
    var fields = document.getElementById("payFields");
    fields.innerHTML = "";

    if(state.payMethod === "Cash"){
      fields.innerHTML =
        '<div class="pay-field"><label>Amount received</label><input type="number" id="cashReceived" placeholder="0"></div>' +
        '<p class="pay-note" id="payNote"></p>';
      document.getElementById("cashReceived").addEventListener("input", function(){ updateCompleteState(); });
    } else if(state.payMethod === "Due"){
      var avail = c.creditLimit - c.due;
      fields.innerHTML =
        '<div class="pay-field"><label>Paid now (optional)</label><input type="number" id="paidNow" placeholder="0"></div>' +
        '<p class="pay-note" id="payNote">Available credit: Tk ' + avail.toLocaleString() + '</p>';
      document.getElementById("paidNow").addEventListener("input", function(){ updateCompleteState(); });
    } else {
      fields.innerHTML = '<p class="pay-note ok">' + state.payMethod + ' payment will be captured for the full total.</p>';
    }
  }

  function updateCompleteState(){
    var t = calcTotals();
    var btn = document.getElementById("completeBtn");
    var note = document.getElementById("payNote");
    var ok = state.cart.length > 0;

    if(ok && state.payMethod === "Cash"){
      var received = parseFloat(document.getElementById("cashReceived").value) || 0;
      if(received < t.total){
        ok = false;
        if(note){ note.textContent = received > 0 ? "Amount received is less than the total." : ""; note.className = "pay-note" + (received > 0 ? " err" : ""); }
      } else if(note){
        note.textContent = "Change due: Tk " + (received - t.total).toLocaleString();
        note.className = "pay-note ok";
      }
    }

    if(ok && state.payMethod === "Due"){
      var c = getCustomer();
      var paidNow = parseFloat(document.getElementById("paidNow").value) || 0;
      var newDueAmount = t.total - paidNow;
      var avail = c.creditLimit - c.due;
      if(newDueAmount > avail){
        ok = false;
        if(note){ note.textContent = "Credit limit exceeded. Available credit is Tk " + avail.toLocaleString() + "."; note.className = "pay-note err"; }
      } else if(note){
        note.textContent = "Available credit: Tk " + avail.toLocaleString() + " · New due: Tk " + Math.max(newDueAmount,0).toLocaleString();
        note.className = "pay-note ok";
      }
    }

    btn.disabled = !ok;
  }

  renderProducts();
  renderCart();

  /* ---------- Complete sale ---------- */
  document.getElementById("completeBtn").addEventListener("click", function(){
    var btn = this;
    var spinner = document.getElementById("completeSpinner");
    var label = document.getElementById("completeLabel");
    btn.disabled = true;
    spinner.style.display = "inline-block";
    label.textContent = "Processing…";

    setTimeout(function(){
      spinner.style.display = "none";
      label.textContent = "Complete sale";
      showReceipt();
    }, 900);
  });

  function showReceipt(){
    var t = calcTotals();
    var c = getCustomer();
    var invoiceNo = "INV-2026-" + String(invoiceCounter).padStart(5,"0");
    invoiceCounter++;

    var itemsHtml = state.cart.map(function(l){
      var p = products.find(function(pp){ return pp.id === l.id; });
      return '<div class="rc-item"><span>' + p.name + ' x' + l.qty + '</span><span>Tk ' + (p.price*l.qty).toLocaleString() + '</span></div>';
    }).join("");

    var paidLine = "", dueLine = "";
    if(state.payMethod === "Cash"){
      var received = parseFloat(document.getElementById("cashReceived").value) || 0;
      paidLine = '<div class="rc-summary-row"><span>Paid (cash)</span><span>Tk ' + received.toLocaleString() + '</span></div>';
      dueLine = '<div class="rc-summary-row"><span>Change</span><span>Tk ' + (received - t.total).toLocaleString() + '</span></div>';
    } else if(state.payMethod === "Due"){
      var paidNow = parseFloat(document.getElementById("paidNow").value) || 0;
      var due = Math.max(t.total - paidNow, 0);
      paidLine = '<div class="rc-summary-row"><span>Paid now</span><span>Tk ' + paidNow.toLocaleString() + '</span></div>';
      dueLine = '<div class="rc-summary-row"><span>Due</span><span>Tk ' + due.toLocaleString() + '</span></div>';
    } else {
      paidLine = '<div class="rc-summary-row"><span>Paid (' + state.payMethod.toLowerCase() + ')</span><span>Tk ' + t.total.toLocaleString() + '</span></div>';
    }

    var loyaltyLine = "";
    if(c.id !== "guest"){
      var pointsEarned = Math.floor(t.subtotal / 100);
      loyaltyLine = '<div class="rc-loyalty">' + c.name + ' earned ' + pointsEarned + ' loyalty points</div>';
    }

    document.getElementById("receiptCard").innerHTML =
      '<h3>SMART RETAIL STORE</h3>' +
      '<p class="rc-sub">Terminal 03 · Dhaka Central</p>' +
      '<p class="rc-sub">' + invoiceNo + ' · Cashier Karim</p>' +
      '<hr class="rc-rule">' +
      itemsHtml +
      '<hr class="rc-rule">' +
      '<div class="rc-summary-row"><span>Subtotal</span><span>Tk ' + t.subtotal.toLocaleString() + '</span></div>' +
      (t.loyaltyDiscount > 0 ? '<div class="rc-summary-row"><span>Loyalty discount</span><span>-Tk ' + t.loyaltyDiscount.toLocaleString() + '</span></div>' : '') +
      '<div class="rc-summary-row"><span>VAT (5%)</span><span>Tk ' + t.vat.toLocaleString() + '</span></div>' +
      '<div class="rc-total-row"><span>Total</span><span>Tk ' + t.total.toLocaleString() + '</span></div>' +
      paidLine + dueLine +
      loyaltyLine +
      '<div class="rc-barcode"></div>' +
      '<p class="rc-barcode-label">' + invoiceNo + '</p>' +
      '<div class="rc-actions">' +
        '<button class="btn-print" id="printBtn">Print</button>' +
        '<button class="btn-new" id="newSaleBtn">New sale</button>' +
      '</div>';

    document.getElementById("overlay").classList.add("show");
    document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
    document.getElementById("newSaleBtn").addEventListener("click", function(){
      state.cart = [];
      state.customerId = "guest";
      customerSelect.value = "guest";
      renderCustomerMeta();
      renderCart();
      document.getElementById("overlay").classList.remove("show");
    });
  }
</script>

</body>
</html>
